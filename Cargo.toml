[workspace]
resolver = "2"
members = ["crates/frank-core", "apps/desktop/src-tauri"]
# The desktop app needs a system WebView to build; CI builds it on macOS.
default-members = ["crates/frank-core"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/fatmali/frank"
rust-version = "1.94"
